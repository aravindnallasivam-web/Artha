name: Docker

# Builds the web app image and publishes it to GitHub Container Registry, so a
# machine can run Artha with `docker run` instead of cloning and building:
#   docker run -d --name artha-web -p 8080:80 --restart unless-stopped \
#     ghcr.io/aravindnallasivam-web/artha-web:latest
# Multi-arch (amd64 + arm64) so it runs natively on Intel and Apple Silicon Macs.

on:
  push:
    branches: [main, "claude/**"]
    paths:
      - server/src/Artha.Api/ClientApp/**
      - .github/workflows/docker.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build and push web image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/artha-web
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: server/src/Artha.Api/ClientApp
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
