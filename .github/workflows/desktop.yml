name: Desktop

# Builds the Electron desktop installers (macOS / Windows / Linux) with
# electron-builder. Installer builds are heavy, so this runs on demand
# (workflow_dispatch) and on version tags (v*), where the artifacts are also
# attached to a GitHub Release. Builds are unsigned — code signing/notarization
# is intentionally out of scope.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: server/src/Artha.Api/ClientApp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: server/src/Artha.Api/ClientApp/package-lock.json

      - name: Read app version
        id: version
        shell: bash
        run: echo "name=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Install web dependencies
        run: npm ci

      - name: Build web bundle
        run: npm run build

      - name: Install Electron toolchain
        run: npm --prefix electron install

      - name: Build desktop installers
        # --publish never: just produce local artifacts; releasing is a separate
        # job. CSC_IDENTITY_AUTO_DISCOVERY=false stops macOS from trying to sign.
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm --prefix electron run dist -- --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: artha-desktop-${{ matrix.os }}-v${{ steps.version.outputs.name }}-build${{ github.run_number }}
          if-no-files-found: error
          path: |
            server/src/Artha.Api/ClientApp/electron/dist-electron/*.dmg
            server/src/Artha.Api/ClientApp/electron/dist-electron/*.zip
            server/src/Artha.Api/ClientApp/electron/dist-electron/*.exe
            server/src/Artha.Api/ClientApp/electron/dist-electron/*.AppImage
            server/src/Artha.Api/ClientApp/electron/dist-electron/*.deb

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "Artha ${{ github.ref_name }}" \
            --generate-notes \
            artifacts/*/*
