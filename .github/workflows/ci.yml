name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

jobs:
  build:
    name: build (.NET 10 + Node 22 -> single artifact)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: server/src/Artha.Api/ClientApp/package-lock.json

      - name: Restore .NET
        working-directory: server
        run: dotnet restore Artha.slnx

      - name: Build
        working-directory: server
        run: dotnet build Artha.slnx --no-restore --configuration Release

      - name: Test
        working-directory: server
        run: dotnet test Artha.slnx --no-build --configuration Release --logger "trx;LogFileName=test-results.trx"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-test-results
          path: server/**/TestResults/*.trx

      - name: Publish (builds the Angular SPA into wwwroot via PublishSpa target)
        working-directory: server
        run: dotnet publish src/Artha.Api/Artha.Api.csproj --configuration Release --no-build --output publish /p:UseAppHost=false

      - uses: actions/upload-artifact@v4
        with:
          name: artha-publish
          path: server/publish
