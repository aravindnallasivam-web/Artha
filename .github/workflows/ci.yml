name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

# Serverless app: the deliverable is the Capacitor web/Android client under
# server/src/Artha.Api/ClientApp. This job type-checks and builds the SPA.
jobs:
  build:
    name: build (Angular SPA)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/src/Artha.Api/ClientApp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: server/src/Artha.Api/ClientApp/package-lock.json

      - name: Install
        run: npm ci

      - name: Build (mobile config)
        run: npm run build:mobile

      - uses: actions/upload-artifact@v4
        with:
          name: artha-web-dist
          path: server/src/Artha.Api/ClientApp/dist
