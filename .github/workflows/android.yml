name: Android

# Builds the Capacitor Android app: compiles the Angular SPA with the mobile
# configuration, syncs it into the native project, and assembles a debug APK
# that is uploaded as a downloadable artifact. This is a debug (unsigned) build
# meant for testing on a device — release signing is intentionally out of scope.

on:
  push:
    branches: [main, "claude/**"]
    # Changes that can't affect the APK: the web image's server setup and docs.
    paths-ignore:
      - server/src/Artha.Api/ClientApp/Dockerfile
      - server/src/Artha.Api/ClientApp/.dockerignore
      - server/src/Artha.Api/ClientApp/nginx/**
      - docker-compose*.yml
      - .github/workflows/docker.yml
      - '**/*.md'
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch replaces a build still in progress.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

# contents: write lets a branch build publish the APK to the "android-latest" release.
permissions:
  contents: write

# The Capacitor project (web + native android/) lives under the API's ClientApp.
defaults:
  run:
    working-directory: server/src/Artha.Api/ClientApp

jobs:
  android:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: server/src/Artha.Api/ClientApp/package-lock.json

      # AGP 8.13 / compileSdk 36 / Gradle 8.14 require JDK 21.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The ubuntu-latest runner ships with the Android SDK pre-installed at
      # $ANDROID_HOME; android-actions/setup-android@v3 is skipped because it
      # still runs the legacy `sdkmanager tools` which Google retired, exiting
      # non-zero before our build gets a chance. Accepting licenses + installing
      # the exact packages we need (which may lag the runner image by a
      # release) is enough.
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      # Gradle build/dependency caching keyed on the wrapper + gradle files.
      - uses: gradle/actions/setup-gradle@v4

      - name: Install web dependencies
        run: npm ci

      # Human-facing version comes from package.json; versionCode is derived
      # from the run number inside build.gradle (via GITHUB_RUN_NUMBER).
      - name: Read app version
        id: version
        run: echo "name=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build web bundle (mobile configuration)
        run: npm run build:mobile

      - name: Capacitor sync (Android)
        run: npx cap sync android

      - name: Assemble debug APK
        working-directory: server/src/Artha.Api/ClientApp/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      # Stamp the version + build number onto the APK file itself, so a
      # downloaded artifact is self-identifying.
      - name: Name the APK with the version
        working-directory: server/src/Artha.Api/ClientApp/android/app/build/outputs/apk/debug
        run: mv app-debug.apk "artha-v${{ steps.version.outputs.name }}-build${{ github.run_number }}-debug.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: artha-android-v${{ steps.version.outputs.name }}-build${{ github.run_number }}
          path: server/src/Artha.Api/ClientApp/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Also publish the APK as a plain .apk on one rolling release, so the
      # newest build is one tap away on a phone (GitHub's mobile pages don't
      # show workflow artifacts, and artifacts download as a zip):
      #   https://github.com/<owner>/<repo>/releases/tag/android-latest
      - name: Publish to the android-latest release
        if: github.event_name != 'pull_request'
        working-directory: server/src/Artha.Api/ClientApp/android/app/build/outputs/apk/debug
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: android-latest
        run: |
          APK=$(ls *.apk)
          cp "$APK" artha-latest.apk
          NOTES="Build ${{ github.run_number }} (v${{ steps.version.outputs.name }}) from ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}.
          Download artha-latest.apk below and open it on the phone to install."
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create "$TAG" artha-latest.apk "$APK" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --prerelease \
            --title "Artha Android - build ${{ github.run_number }}" --notes "$NOTES"
