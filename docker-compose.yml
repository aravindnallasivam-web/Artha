# Run the Artha web app locally: `docker compose up -d --build`, then open
# http://localhost:8080. Sign-in needs http://localhost:8080/auth/callback in
# the Google OAuth client's Authorized redirect URIs (see README).
services:
  artha-web:
    build:
      context: ./server/src/Artha.Api/ClientApp
    image: artha-web:local
    container_name: artha-web
    ports:
      - "8080:80"
    environment:
      # Secret of the Google "Web application" OAuth client, used server-side
      # by /oauth/token. Put it in a .env file next to this one (never commit it).
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?set GOOGLE_CLIENT_SECRET in .env}
    restart: unless-stopped
