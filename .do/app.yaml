# DigitalOcean App Platform spec for Artha.
#
# Single component (consolidated .NET SPA). The .NET 10 process serves both:
#   /api/*  -> ASP.NET Core Web API
#   /*      -> Angular SPA static files (copied to wwwroot at publish time)
#
# To deploy:
#   1. Push this repo to GitHub (already done).
#   2. Use `doctl apps create --spec .do/app.yaml`
#      OR in the DO UI: Apps -> Create App -> "Edit your app spec" -> paste this.
#   3. Set the two encrypted secrets in Settings -> Components -> api ->
#      Environment Variables:
#        GoogleAuth__ClientSecret, Jwt__SigningKey
#      (Client ID is public and lives in this file.)
#   4. After first deploy, copy the app's URL into your Google Cloud Console
#      OAuth client's authorized redirect URIs:
#        https://<app-url>/auth/callback

name: artha
region: nyc

services:
  - name: api
    dockerfile_path: server/Dockerfile
    source_dir: server
    github:
      repo: aravindnallasivam-web/Artha
      branch: claude/expense-management-app-nHuZp
      deploy_on_push: true
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    health_check:
      http_path: /api/health
      initial_delay_seconds: 30
      period_seconds: 30
      timeout_seconds: 5
      failure_threshold: 3
    # No `routes` block — this service owns the whole hostname (default).
    envs:
      - key: ASPNETCORE_ENVIRONMENT
        scope: RUN_TIME
        value: Production
      - key: ASPNETCORE_FORWARDEDHEADERS_ENABLED
        scope: RUN_TIME
        value: "true"
      # Client ID is public (it's embedded in the SPA bundle anyway).
      - key: GoogleAuth__ClientId
        scope: RUN_TIME
        value: 952436597649-j9gosps5n1ukkm1907fu8bl06toptdb6.apps.googleusercontent.com
      - key: GoogleAuth__ClientSecret
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_IN_DO_DASHBOARD
      - key: Jwt__SigningKey
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_IN_DO_DASHBOARD
      - key: Jwt__Issuer
        scope: RUN_TIME
        value: artha-api
      - key: Jwt__Audience
        scope: RUN_TIME
        value: artha-client
      # CORS is only relevant for the Capacitor mobile app (cross-origin from
      # capacitor://localhost / ionic://localhost). Web is same-origin.
      - key: Cors__AllowedOrigins__0
        scope: RUN_TIME
        value: capacitor://localhost
      - key: Cors__AllowedOrigins__1
        scope: RUN_TIME
        value: ionic://localhost
      # Postgres connection for the user_tokens table. Without this, the API
      # falls back to InMemoryUserTokenStore and every redeploy logs users
      # out. Two ways to populate this:
      #   (a) Add a Dev Database (free) under "Resources" — DO exposes its
      #       URL as ${<binding-name>.DATABASE_URL}. Set this env to that.
      #   (b) Create a Managed Postgres cluster and add it as a database
      #       resource — same ${<binding-name>.DATABASE_URL} pattern.
      # Either way, paste the resolved value (or the ${...} expression) into
      # the dashboard after adding the resource.
      - key: ConnectionStrings__Tokens
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_IN_DO_DASHBOARD
