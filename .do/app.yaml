# DigitalOcean App Platform spec for Artha.
#
# Two components share one hostname (no CORS needed):
#   /api/*  -> .NET 10 web service (Dockerfile build)
#   /*      -> Angular SPA (static site, SPA-routed)
#
# To deploy:
#   1. Push this repo to GitHub (already done).
#   2. In DO: Apps -> Create App -> "Edit your app spec" -> paste this file,
#      OR use `doctl apps create --spec .do/app.yaml`.
#   3. Set the three secrets below in the Settings -> Components -> api -> Environment Variables UI:
#        GoogleAuth__ClientId, GoogleAuth__ClientSecret, Jwt__SigningKey
#   4. After first deploy, copy the app's URL (e.g. artha-xxxx.ondigitalocean.app)
#      into your Google Cloud Console OAuth client's authorized redirect URIs:
#        https://<app-url>/auth/callback

name: artha
region: nyc

services:
  - name: api
    dockerfile_path: server/Dockerfile
    source_dir: server
    github:
      repo: aravindnallasivam-web/Artha
      branch: main
      deploy_on_push: true
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    health_check:
      http_path: /api/health
      initial_delay_seconds: 10
      period_seconds: 30
      timeout_seconds: 5
      failure_threshold: 3
    routes:
      - path: /api
    envs:
      - key: ASPNETCORE_ENVIRONMENT
        scope: RUN_TIME
        value: Production
      - key: ASPNETCORE_FORWARDEDHEADERS_ENABLED
        scope: RUN_TIME
        value: "true"
      - key: GoogleAuth__ClientId
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_IN_DO_DASHBOARD
      - key: GoogleAuth__ClientSecret
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_IN_DO_DASHBOARD
      - key: Jwt__SigningKey
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_IN_DO_DASHBOARD
      - key: Jwt__Issuer
        scope: RUN_TIME
        value: artha-api
      - key: Jwt__Audience
        scope: RUN_TIME
        value: artha-client
      # Same-origin in production -> empty CORS list is fine, but we keep
      # the app URL on the allow-list for defense in depth.
      - key: Cors__AllowedOrigins__0
        scope: RUN_TIME
        value: ${APP_URL}

static_sites:
  - name: web
    source_dir: client
    github:
      repo: aravindnallasivam-web/Artha
      branch: main
      deploy_on_push: true
    build_command: npm ci && npm run build -- --configuration=production
    output_dir: dist/client/browser
    index_document: index.html
    catchall_document: index.html
    routes:
      - path: /
    envs:
      - key: NODE_OPTIONS
        scope: BUILD_TIME
        value: --max-old-space-size=4096
